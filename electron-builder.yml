appId: dev.draht.client
productName: Draht
copyright: GPL-3.0-or-later

# Where installed copies look for updates. Declaring this makes electron-builder write an
# `app-update.yml` into the packaged resources, which is what electron-updater reads at
# runtime — so the feed URL is never hardcoded in the app.
#
# Publishing uploads the installer plus a `latest.yml` manifest to a GitHub Release.
# `npm run mod:release` does that and needs GH_TOKEN set.
publish:
  provider: github
  owner: reniaz
  repo: draht
  releaseType: release

directories:
  output: release
  buildResources: electron/assets

# Only what the app actually loads at runtime. `build/` is the built web app, served by the
# loopback server in electron/server.ts; the source tree and node_modules are not needed.
files:
  - build/**/*
  # Source maps are ~30 MB and only useful when debugging the renderer.
  - '!build/**/*.map'
  - '!build/build-stats.json'
  - electron/dist/**/*
  - '!electron/dist/**/*.map'
  - electron/assets/icon-*.png
  - electron/assets/icon-*.ico
  - package.json
  # electron-builder bundles production `dependencies` by default. None are needed at
  # runtime: Vite bundles every renderer dependency into `build/`, and tsup bundles the
  # main process with only `electron` (supplied by the runtime) left external. Including
  # them added ~14.5k files and took the asar from ~30 MB to 211 MB.
  - '!node_modules/**/*'

# Source maps roughly double the payload and are only useful when debugging the renderer.
asarUnpack: []

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/assets/icon-wire.ico
  # Unsigned builds trigger SmartScreen on first run. Signing needs a real code-signing
  # certificate; without one, recipients must click "More info" -> "Run anyway".
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Draht
  artifactName: Draht-Setup-${version}.${ext}
  uninstallDisplayName: Draht

# electron-builder's default AppImage runtime is the FUSE 2 one, and Fedora ships FUSE 3 —
# an AppImage built with the default refuses to start there, with "dlopen(): error loading
# libfuse.so.2". This runtime is static and needs no FUSE at all. It also stops the desktop
# entry carrying a blanket `--no-sandbox`, passing it only where user namespaces are
# genuinely unavailable.
toolsets:
  appimage: '1.0.3'

linux:
  # The AppImage updates itself in place with no privileges, so it keeps working wherever
  # the app was put. The rpm is the native install for Fedora, and electron-updater
  # updates that too, through `dnf` under `pkexec`.
  target:
    - target: AppImage
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: electron/assets/icon-wire-512.png
  category: Network
  synopsis: Telegram client with a plugin system
  description: A Telegram client with a plugin system, built on telegram-tt.
  # Lowercase, because it becomes `/usr/bin/<name>` and the desktop entry's `Icon`.
  executableName: draht
  # Electron takes its Wayland `app_id` and X11 `WM_CLASS` from `desktopName` in
  # package.json; the desktop environment matches a running window to its launcher by
  # exactly that. Without the two agreeing, GNOME shows the window under a generic icon
  # and does not group it with the app. `syncDesktopName` names the installed file to
  # match, and electron-builder writes `StartupWMClass` from the same value.
  syncDesktopName: true
  # The author field in package.json is upstream's, and carries no parseable email, which
  # rpm requires. The GitHub no-reply address of the account that publishes the releases
  # is the honest answer and is not a personal mailbox.
  maintainer: reniaz <reniaz@users.noreply.github.com>
  artifactName: Draht-${version}.${ext}
  desktop:
    entry:
      Keywords: telegram;chat;messenger;im;

rpm:
  # Without this the package is named for the upstream project, `telegram-t`, which is
  # what `dnf` would then list and what every later upgrade has to keep matching.
  packageName: draht

mac:
  target:
    - dmg
  icon: electron/assets/icon-wire-512.png
  category: public.app-category.social-networking
